<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fullorama</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="header">
        <h1><img src="icons/lockup.png" alt="Fullorama" width="121" height="24" /></h1>
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">Loading…</span>
        </div>
      </header>

      <section class="original">
        <p class="eyebrow">Original</p>
        <div class="original-frame" aria-hidden="true">
          <img src="preview.jpg" alt="" width="560" height="315" />
        </div>
      </section>

      <div class="branch" aria-hidden="true"></div>

      <div class="modes" role="group" aria-label="Fill mode">
        <button class="option" id="mode-crop" type="button" data-mode="crop" aria-pressed="false">
          <span class="preview" aria-hidden="true">
            <img class="preview-frame" src="preview.jpg" alt="" width="560" height="315" />
          </span>
          <span class="mirror" aria-hidden="true">
            <span class="preview preview--mirror">
              <img class="preview-frame" src="preview.jpg" alt="" width="560" height="315" />
            </span>
          </span>
          <span class="option-body">
            <span class="radio" aria-hidden="true"></span>
            <span class="option-copy">
              <span class="option-label">Crop</span>
              <span class="option-desc">Keeps the shape.<br />Cuts off the edges.</span>
            </span>
          </span>
        </button>

        <button class="option" id="mode-stretch" type="button" data-mode="stretch" aria-pressed="false">
          <span class="preview" aria-hidden="true">
            <img class="preview-frame" src="preview.jpg" alt="" width="560" height="315" />
          </span>
          <span class="mirror" aria-hidden="true">
            <span class="preview preview--mirror">
              <img class="preview-frame" src="preview.jpg" alt="" width="560" height="315" />
            </span>
          </span>
          <span class="option-body">
            <span class="radio" aria-hidden="true"></span>
            <span class="option-copy">
              <span class="option-label">Stretch</span>
              <span class="option-desc">Shows everything.<br />Pulls the video to fit.</span>
            </span>
          </span>
        </button>
      </div>

      <footer class="footer">
        <a href="https://tally.so/r/Y5vaDJ" id="feedback" target="_blank" rel="noreferrer">Share feedback</a>
        <span class="version">v<span id="version">—</span></span>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
