<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fullorama</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1><img src="icons/lockup.png" alt="Fullorama" width="121" height="24" /></h1>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Loading…</span>
      </div>

      <div class="modes" role="group" aria-label="Fill mode">
        <button class="mode" id="mode-crop" type="button" data-mode="crop" aria-pressed="false">
          <span class="preview" aria-hidden="true">
            <img class="preview-frame" src="preview.jpg" alt="" width="560" height="315" />
          </span>
          <span class="mode-label">Crop</span>
        </button>

        <button class="mode" id="mode-stretch" type="button" data-mode="stretch" aria-pressed="false">
          <span class="preview" aria-hidden="true">
            <img class="preview-frame" src="preview.jpg" alt="" width="560" height="315" />
          </span>
          <span class="mode-label">Stretch</span>
        </button>
      </div>

      <div class="links">
        <a href="https://tally.so/r/Y5vaDJ" id="feedback" target="_blank" rel="noreferrer">Share feedback</a>
      </div>

      <div class="footer">
        <a href="https://github.com/sudhz" target="_blank" rel="noreferrer">Built by @sudhz</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/sudhz/fullorama" target="_blank" rel="noreferrer">View source</a>
        <span class="version">v<span id="version">—</span></span>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
